name: Benvenuto da un modulo
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  commento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commenta con lo script del repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const benvenuto = require("./.github/scripts/benvenuto.js");
            await benvenuto({ github, context });
